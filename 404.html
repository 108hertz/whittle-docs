<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page not found</title>
  <meta name="robots" content="noindex" />

  <!--
    GitHub Pages serves this file for any unmatched path, at any depth, so it cannot rely on
    the shared stylesheet or on relative links: a request for /whittle-docs/a/b/c would resolve
    assets/... against /whittle-docs/a/b/. Styles are inlined and links are site-root absolute.
    If the site ever moves to a custom domain at the root, drop the /whittle-docs prefix below.
  -->
  <style>
    :root {
      --primary: #2A2D66;
      --accent:  #D9793C;
      --bg:      #f5f7fc;
      --surface: #ffffff;
      --muted:   #6b7280;
      --border:  rgba(42,45,102,0.10);
    }
    *, *::before, *::after { box-sizing: border-box }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.7;
      color: #1e2035;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,168,204,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(42,45,102,0.07) 0%, transparent 55%);
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(42,45,102,0.14), 0 4px 12px rgba(42,45,102,0.08);
      padding: 40px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--primary);
    }
    h1::after {
      content: "";
      display: block;
      width: 64px;
      height: 3px;
      margin: 16px auto 0;
      border-radius: 2px;
      background: var(--accent);
    }
    p { margin: 20px 0 0; color: var(--muted) }
    ul {
      list-style: none;
      margin: 28px 0 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a.btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-weight: 600;
      text-decoration: none;
      color: var(--primary);
      background: var(--bg);
    }
    a.btn:hover { border-color: var(--accent); color: var(--accent) }
    a.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary) }
    a.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff }
    footer { margin-top: 28px; font-size: 0.875rem; color: var(--muted) }
    footer a { color: inherit }
  </style>
</head>
<body>
  <main role="main">
    <h1>Page not found</h1>
    <p>That address doesn’t match a page on the Whittle site. The pages below are the ones you’re most likely after.</p>

    <ul>
      <li><a class="btn primary" href="/whittle-docs/">Home</a></li>
      <li><a class="btn" href="/whittle-docs/SUPPORT.html">Support</a></li>
      <li><a class="btn" href="/whittle-docs/PRIVACY_POLICY.html">Privacy Policy</a></li>
      <li><a class="btn" href="/whittle-docs/TERMS_OF_USE.html">Terms of Use</a></li>
    </ul>

    <footer>
      <p>© 2026 108hertz · <a href="mailto:1008hertz@gmail.com">1008hertz@gmail.com</a></p>
    </footer>
  </main>
</body>
</html>
